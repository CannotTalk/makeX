<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make X</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="loading">
        <div class="progress-container">
          <div class="progress-bar"></div>
        </div>
        <p id="progress-text">0%</p>
    </div>

    <!-- Achievement Popup Structure -->
    <div id="achievement-popup" class="achievement-popup hidden">
        <div class="achievement-content">
        <!-- ↓内容はJavaScriptで動的に設定される -->
        <strong class="achievement-title"></strong>
        <p class="achievement-desc"></p>
        </div>
    </div>

<main>
    <h1>Welcome to Make X</h1>

    <div id="timer-container">
        <span id="timer">00:00:00.00</span>
    </div>

    <div id="numbers-container">
        <!-- 初期表示のフォーマット変更 -->
        <span id="numbers">? , ? , ? , ? to make ?</span>
    </div>

    <!-- Generate/Stopボタン統合 -->
    <div id="action-button-container">
        <button id="action-button">Generate</button>
    </div>

    <div id="answer-button-container">
        <button id="answer-button">Solution Ex.</button>
        <div id="solution-display" style="margin-top: 5px;"></div>
    </div>
</main>
</body>
<footer>
    <div id="footer">
        <p>© 2025 Make 10 Game By CannotTalk</p>
    </div>
</footer>

<!-- スクリプトの読み込み順序に注意 -->
<script src="scripts/loading.js"></script>
<!-- make10.js でグローバル変数を定義するので先に読み込む -->
<script src="scripts/make10.js"></script>
<!-- popup-achievements.js は make10.js の要素を参照するので後に読み込む -->
<script src="scripts/popup-achievements.js"></script>

</html>
